  <rect x="12" y="12" width="488" height="488" rx="104" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="url(#glow)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#d9b6ff" stroke-opacity="0.25" stroke-width="4"/>

