<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="XPOSE Beauty Shop Limited">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d32ff"/>
      <stop offset="0.42" stop-color="#38106e"/>
      <stop offset="1" stop-color="#160526"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a5"/>
      <stop offset="0.35" stop-color="#ffd45a"/>
      <stop offset="0.7" stop-color="#f7ae1b"/>
      <stop offset="1" stop-color="#b96b00"/>
